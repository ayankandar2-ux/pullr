name: Debug APK Build

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Create blank local.properties
        run: touch local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleGithubDebug --warning-mode all --stacktrace 2>&1 | tee build_output.txt

      - name: Post build log on failure
        if: steps.build.outcome == 'failure'
        run: |
          python3 -c "
import json
with open('build_output.txt') as f:
    content = f.read()
tail = content[-55000:]
with open('comment_body.json', 'w') as out:
    json.dump({'body': '```\n' + tail + '\n```'}, out)
"
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @comment_body.json \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate APKs
        run: |
          mkdir -p /tmp/apks
          find app/build/outputs/apk/github/debug -type f -name '*.apk' -exec cp {} /tmp/apks/ \;
          ls -la /tmp/apks

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-debug-apk
          path: /tmp/apks/*.apk

      - name: Publish APKs to debug release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quick-pick-debug
          name: Quick pick sheet - debug build
          body: |
            Auto-built debug APK from ${{ github.ref_name }} @ ${{ github.sha }}.
            Not for general distribution - development build only.

            Most phones: download the `universal` or `arm64-v8a` APK.
          prerelease: true
          files: /tmp/apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
