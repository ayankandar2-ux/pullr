name: Debug APK Build

on:
  push:
    branches:
      - "feature/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Create blank local.properties
        run: touch local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: ./gradlew assembleGithubDebug --warning-mode all --stacktrace 2>&1 | tee build_output.txt

      - name: Post build log (always)
        if: always()
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "build step outcome: ${{ steps.build.outcome }}" > build_output_tail.txt
          echo "" >> build_output_tail.txt
          tail -c 50000 build_output.txt >> build_output_tail.txt 2>/dev/null || echo "no build_output.txt" >> build_output_tail.txt
          python3 .github/scripts/post_build_log.py

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate APKs
        id: locate
        run: |
          mkdir -p /tmp/apks
          {
            echo "--- outputs tree ---"
            find app/build/outputs -maxdepth 5 2>&1 || true
            echo "--- searching for apks ---"
            find app/build/outputs -type f -name '*.apk' 2>&1 | tee /tmp/apk_list.txt || true
          } > /tmp/locate_debug.txt
          while IFS= read -r f; do cp "$f" /tmp/apks/; done < /tmp/apk_list.txt
          echo "--- collected apks ---"
          ls -la /tmp/apks

      - name: Post outputs diagnostics
        if: always()
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/locate_debug.txt build_output_tail.txt 2>/dev/null || echo "no locate debug" > build_output_tail.txt
          python3 .github/scripts/post_build_log.py

      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-debug-apk
          path: /tmp/apks/*.apk

      - name: Publish APKs to debug release tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quick-pick-debug
          name: Pullr — debug build
          body: |
            Auto-built debug APK from ${{ github.ref_name }} @ ${{ github.sha }}.
            Not for general distribution - development build only.

            Most phones: download the `universal` or `arm64-v8a` APK.
          prerelease: true
          files: /tmp/apks/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
